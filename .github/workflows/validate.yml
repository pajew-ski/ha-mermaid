name: Validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate-hacs:
    runs-on: ubuntu-latest
    name: HACS Validation
    steps:
      - uses: actions/checkout@v7
      - name: HACS Action
        uses: hacs/action@d556e736723344f83838d08488c983a15381059a # 22.5.0
        with:
          category: plugin
          # No 'ignore' field — all checks run:
          # archived, description, hacsjson, information, topics

  build:
    runs-on: ubuntu-latest
    name: Build
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"

      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test

      - name: Verify dist output exists
        run: test -f dist/ha-mermaid.js
