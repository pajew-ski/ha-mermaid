version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    groups:
      npm:
        patterns: ["*"]
    # shortcut: typescript-eslint 8 allows TypeScript only below 6.1, lift this once it accepts 7
    ignore:
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
